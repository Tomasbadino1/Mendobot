<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MendoBot — Voz (RF-05)</title>
    <style>
      /* RNF-02: interfaz clara, accesible y legible. */
      :root {
        --azul: #1f4e79;
        --azul-claro: #e8f0fe;
        --gris: #f4f5f7;
        --texto: #1a1a1a;
        --borde: #d0d4da;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--gris);
        color: var(--texto);
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      .app {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-left: 1px solid var(--borde);
        border-right: 1px solid var(--borde);
      }
      header {
        background: var(--azul);
        color: #fff;
        padding: 16px 20px;
      }
      header h1 { font-size: 1.1rem; margin: 0; }
      header p { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.85; }

      #conversacion {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 320px;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.4;
        font-size: 0.95rem;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .msg-user {
        align-self: flex-end;
        background: var(--azul);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg-bot {
        align-self: flex-start;
        background: var(--azul-claro);
        color: var(--texto);
        border-bottom-left-radius: 4px;
      }
      .msg-sys {
        align-self: center;
        background: #fff4d6;
        color: #6a4b00;
        font-size: 0.85rem;
        border: 1px solid #f0d98a;
      }

      .barra-estado {
        padding: 6px 16px;
        font-size: 0.8rem;
        color: #555;
        border-top: 1px solid var(--borde);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .voz-toggle { display: flex; align-items: center; gap: 6px; }

      .entrada {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--borde);
        align-items: center;
      }
      #text-input {
        flex: 1;
        padding: 12px 14px;
        font-size: 0.95rem;
        border: 1px solid var(--borde);
        border-radius: 24px;
        outline: none;
      }
      #text-input:focus { border-color: var(--azul); }

      button {
        cursor: pointer;
        border: none;
        border-radius: 50%;
        width: 46px;
        height: 46px;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #send-btn {
        background: var(--azul);
        color: #fff;
        border-radius: 24px;
        width: auto;
        padding: 0 18px;
        font-size: 0.9rem;
      }
      #mic-btn { background: var(--azul-claro); color: var(--azul); }
      #mic-btn.activo {
        background: #d62828;
        color: #fff;
        animation: latido 1s infinite;
      }
      #mic-btn.deshabilitado,
      #mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      @keyframes latido {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>MendoBot · Asistente por voz</h1>
        <p>RF-05 — Escucha, Voz e Interpretación (prototipo con datos simulados)</p>
      </header>

      <!-- Área de conversación legible (RNF-02) -->
      <section id="conversacion" aria-live="polite"></section>

      <div class="barra-estado">
        <span>Estado: <strong id="estado">Listo</strong></span>
        <label class="voz-toggle">
          <input type="checkbox" id="voz-activa" checked />
          Leer respuesta en voz
        </label>
      </div>

      <!-- Micrófono + caja de texto siempre disponible (CA-05.1 / CA-05.3) -->
      <div class="entrada">
        <button id="mic-btn" aria-label="Activar micrófono" aria-pressed="false" title="Hablar">
          🎤
        </button>
        <input
          id="text-input"
          type="text"
          placeholder="Escribí tu consulta o tocá el micrófono…"
          autocomplete="off"
        />
        <button id="send-btn">Enviar</button>
      </div>
    </main>

    <script src="mock-respuestas.js"></script>
    <script src="voice.js"></script>
  </body>
</html>
